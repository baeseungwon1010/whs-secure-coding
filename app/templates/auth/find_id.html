{% extends 'base.html' %}
{% block title %}아이디 찾기{% endblock %}
{% block content %}
<div class="form-card card">
  <h2 class="text-center mb-2">🔍 아이디 찾기</h2>
  <p class="text-muted text-center mb-2" style="font-size:0.9rem;">가입 시 등록한 이메일로 아이디를 발송합니다.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>이메일</label>
      <input class="form-control" type="email" name="email" required maxlength="100" autofocus>
    </div>
    <button type="submit" class="btn btn-primary w-full">아이디 찾기</button>
  </form>
  <div class="text-center mt-2"><a href="{{ url_for('auth.login') }}">← 로그인으로 돌아가기</a></div>
</div>
{% endblock %}
