{% extends 'base.html' %}
{% block title %}비밀번호 찾기{% endblock %}
{% block content %}
<div class="form-card card">
  <h2 class="text-center mb-2">🔑 비밀번호 찾기</h2>
  <p class="text-muted text-center mb-2" style="font-size:0.9rem;">아이디와 이메일이 일치하면 임시 비밀번호를 발송합니다.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>아이디</label>
      <input class="form-control" type="text" name="username" required maxlength="20" autofocus>
    </div>
    <div class="form-group">
      <label>이메일</label>
      <input class="form-control" type="email" name="email" required maxlength="100">
    </div>
    <button type="submit" class="btn btn-primary w-full">임시 비밀번호 발송</button>
  </form>
  <div class="text-center mt-2"><a href="{{ url_for('auth.login') }}">← 로그인으로 돌아가기</a></div>
</div>
{% endblock %}
