{% extends 'base.html' %}
{% block title %}로그인 — 하늘마켓{% endblock %}
{% block content %}
<div class="form-card card">
  <h2 class="text-center mb-2">☁️ 로그인</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>아이디</label>
      <input class="form-control" type="text" name="username" required maxlength="20" autofocus>
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input class="form-control" type="password" name="password" required>
    </div>
    <div class="form-group flex items-center gap-1">
      <input type="checkbox" name="remember" id="remember">
      <label for="remember" style="font-weight:400;">로그인 유지</label>
    </div>
    <button type="submit" class="btn btn-primary w-full">로그인</button>
  </form>
  <div class="text-center mt-2" style="font-size:0.88rem;">
    <a href="{{ url_for('auth.find_id') }}">아이디 찾기</a> ·
    <a href="{{ url_for('auth.find_password') }}">비밀번호 찾기</a> ·
    <a href="{{ url_for('auth.register') }}">회원가입</a>
  </div>
</div>
{% endblock %}
