{% extends 'base.html' %}
{% block title %}비밀번호 변경{% endblock %}
{% block content %}
<div class="form-card card">
  <h2 class="mb-2">🔑 비밀번호 변경</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>현재 비밀번호</label>
      <input class="form-control" type="password" name="current_password" required autofocus>
    </div>
    <div class="form-group">
      <label>새 비밀번호 (8자 이상, 영문+숫자)</label>
      <input class="form-control" type="password" name="new_password" required minlength="8">
    </div>
    <div class="form-group">
      <label>새 비밀번호 확인</label>
      <input class="form-control" type="password" name="confirm_password" required minlength="8">
    </div>
    <button type="submit" class="btn btn-primary">변경</button>
    <a href="{{ url_for('mypage.index') }}" class="btn btn-outline">취소</a>
  </form>
</div>
{% endblock %}
